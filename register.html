<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" ="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Create Account · MordeHost</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050505;
      --card: #0d0d0d;
      --border: #242424;
      --text: #fff;
      --muted: #888;
      --green: #00ff88;
      --danger: #ff5555;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 18px;
    }

    body::before {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      background: var(--green);
      opacity: .055;
      filter: blur(130px);
      border-radius: 50%;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 450px;
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand a {
      color: white;
      text-decoration: none;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--green);
    }

    .card {
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .heading p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .github {
      width: 100%;
      height: 50px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #171717;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: .2s;
    }

    .github:hover {
      background: #202020;
      transform: translateY(-1px);
    }

    .github svg {
      width: 21px;
      height: 21px;
      fill: white;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #666;
      font-size: 11px;
      margin: 23px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
      flex: 1;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 49px;
      background: #080808;
      color: white;
      border: 1px solid #292929;
      border-radius: 10px;
      padding: 0 14px;
      outline: none;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,255,136,.07);
    }

    input::placeholder {
      color: #555;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #777;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .show-password:hover {
      color: var(--green);
    }

    .requirements {
      margin-top: 7px;
      color: #666;
      font-size: 11px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #777;
      font-size: 11px;
      line-height: 1.5;
      margin: 5px 0 20px;
    }

    .terms input {
      width: 15px;
      height: 15px;
      margin-top: 1px;
      accent-color: var(--green);
      flex-shrink: 0;
    }

    .terms a {
      color: var(--green);
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #000;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
    }

    .register-btn:hover {
      background: #21ff99;
      transform: translateY(-1px);
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      color: #ff7777;
      background: rgba(255,50,50,.08);
      border: 1px solid rgba(255,50,50,.2);
    }

    .message.success {
      display: block;
      color: var(--green);
      background: rgba(0,255,136,.07);
      border: 1px solid rgba(0,255,136,.18);
    }

    .login {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 23px;
    }

    .login a {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .security {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }

      .heading h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <a href="index.html">MORDE<span>HOST</span></a>
    </div>

    <div class="card">

      <div class="heading">
        <h1>Create your account</h1>
        <p>Start hosting and managing your bots today.</p>
      </div>

      <div id="message" class="message"></div>

      <!-- GitHub signup -->
      <button type="button" class="github" id="githubBtn">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.4 11.4 0 0 1 6 0c2.29-1.55 3.29-1.23 3.29-1.23.66 1.65.25 2.87.13 3.17.76.84 1.22 1.91 1.22 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5"/>
        </svg>

        Continue with GitHub

      </button>

      <div class="divider">OR CREATE WITH EMAIL</div>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Full name</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            autocomplete="name"
            minlength="2"
            maxlength="80"
            required
          >
        </div>

        <div class="form-group">
          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            pattern="[A-Za-z0-9_]+"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">

          <label for="password">Password</label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              SHOW
            </button>

          </div>

          <div class="requirements">
            Minimum 8 characters.
          </div>

        </div>

        <div class="form-group">

          <label for="confirmPassword">Confirm password</label>

          <div class="password-wrap">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repeat your password"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showConfirm"
            >
              SHOW
            </button>

          </div>

        </div>

        <label class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <span>
            I agree to the
            <a href="terms.html">Terms of Service</a>
            and
            <a href="privacy.html">Privacy Policy</a>.
          </span>

        </label>

        <button
          type="submit"
          class="register-btn"
          id="registerBtn"
        >
          Create Account
        </button>

      </form>

      <div class="login">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

    </div>

    <div class="security">
      🔒 Your account information is protected.
    </div>

  </div>

  <script>

    /*
      Change this if your backend uses another URL.

      Example:
      const API_URL = "https://your-domain.com/api";
    */

    const API_URL = "/api";

    const form = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");
    const githubBtn = document.getElementById("githubBtn");
    const message = document.getElementById("message");

    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function togglePassword(input, button) {

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "HIDE";
      } else {
        input.type = "password";
        button.textContent = "SHOW";
      }

    }

    document
      .getElementById("showPassword")
      .addEventListener("click", function () {
        togglePassword(password, this);
      });

    document
      .getElementById("showConfirm")
      .addEventListener("click", function () {
        togglePassword(confirmPassword, this);
      });

    form.addEventListener("submit", async function (event) {

      event.preventDefault();

      clearMessage();

      const name = document.getElementById("name").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const passwordValue = password.value;
      const confirmValue = confirmPassword.value;

      if (passwordValue.length < 8) {
        showMessage("Password must contain at least 8 characters.");
        return;
      }

      if (passwordValue !== confirmValue) {
        showMessage("Passwords do not match.");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating account...";

      try {

        const response = await fetch(`${API_URL}/auth/register`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          credentials: "include",

          body: JSON.stringify({
            name,
            username,
            email,
            password: passwordValue
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Registration failed."
          );
        }

        /*
          Support either:
          { token: "..." }
          or
          { accessToken: "..." }
        */

        const token = data.token || data.accessToken;

        if (token) {
          localStorage.setItem("mordehost_token", token);
        }

        if (data.user) {
          localStorage.setItem(
            "mordehost_user",
            JSON.stringify(data.user)
          );
        }

        showMessage(
          "Account created successfully. Redirecting...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      } catch (error) {

        showMessage(
          error.message ||
          "Unable to connect to the server."
        );

      } finally {

        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";

      }

    });

    /*
      GitHub OAuth

      Expected backend route:

      GET /api/auth/github
    */

    githubBtn.addEventListener("click", function () {
      window.location.href = `${API_URL}/auth/github`;
    });

  </script>

</body>
</html>
